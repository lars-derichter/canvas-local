<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 12 8" refX="12" refY="4" markerWidth="12" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" rx="12" fill="#f6f8fa"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2328">One Source, Three Outputs</text>

  <!-- Write (the single source) -->
  <rect x="30" y="175" width="170" height="110" rx="10" fill="#0969da"/>
  <text x="115" y="212" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Write</text>
  <text x="115" y="236" text-anchor="middle" font-size="12" fill="#ffffff" fill-opacity="0.85">markdown in course/</text>
  <text x="115" y="254" text-anchor="middle" font-size="12" fill="#ffffff" fill-opacity="0.85">VS Code sidebar</text>

  <!-- Write to Preview -->
  <line x1="204" y1="230" x2="246" y2="230" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Preview -->
  <rect x="250" y="175" width="180" height="110" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="340" y="212" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Preview</text>
  <text x="340" y="236" text-anchor="middle" font-size="12" fill="#59636e">Course: Preview</text>
  <text x="340" y="254" text-anchor="middle" font-size="12" fill="#59636e">live at localhost:3000</text>

  <!-- Fan from Preview to the three outputs -->
  <path d="M434,230 H478" fill="none" stroke="#0969da" stroke-width="2.5"/>
  <path d="M478,132 V328" fill="none" stroke="#0969da" stroke-width="2.5"/>
  <line x1="478" y1="132" x2="556" y2="132" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="478" y1="230" x2="556" y2="230" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="478" y1="328" x2="556" y2="328" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Output 1: Website -->
  <rect x="560" y="92" width="210" height="80" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="665" y="118" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Website</text>
  <text x="665" y="138" text-anchor="middle" font-size="12" fill="#59636e">push to GitHub</text>
  <text x="665" y="156" text-anchor="middle" font-size="12" fill="#59636e">GitHub Pages</text>

  <!-- Output 2: PDF / Word -->
  <rect x="560" y="190" width="210" height="80" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="665" y="216" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">PDF / Word</text>
  <text x="665" y="236" text-anchor="middle" font-size="12" fill="#59636e">Course: Export&#8230;</text>
  <text x="665" y="254" text-anchor="middle" font-size="12" fill="#59636e">a handout or course text</text>

  <!-- Output 3: Canvas -->
  <rect x="560" y="288" width="210" height="80" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="665" y="314" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Canvas</text>
  <text x="665" y="334" text-anchor="middle" font-size="12" fill="#59636e">Course: Sync with Canvas</text>
  <text x="665" y="352" text-anchor="middle" font-size="12" fill="#59636e">modules, pages, files</text>

  <!-- Return path: Canvas edits come back to the source -->
  <path d="M665,368 V402 H115 V288" fill="none" stroke="#0969da" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="390" y="394" text-anchor="middle" font-size="12" fill="#59636e">sync brings Canvas edits back</text>

  <!-- Footer -->
  <text x="400" y="436" text-anchor="middle" font-size="13" fill="#59636e">The same files build all three.</text>
</svg>
